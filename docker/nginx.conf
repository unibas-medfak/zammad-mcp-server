events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream zammad {
        server zammad-railsserver:3000;
    }

    server {
        listen 8080;
        server_name localhost;

        # Serve precompiled assets directly from the shared volume — Rails
        # itself doesn't serve static files in production, so without this
        # every /assets/* request 404s through the app and the SPA never
        # finishes loading.
        location ~ ^/(assets/|favicon\.ico|apple-touch-icon.*\.png|robots\.txt) {
            root /opt/zammad/public;
            expires max;
            add_header Cache-Control "public, immutable";
        }

        location / {
            proxy_pass http://zammad;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
