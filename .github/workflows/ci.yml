name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      # These are advisory for now: the codebase carries a backlog of existing
      # ruff and mypy findings. Drop continue-on-error once that is cleared so
      # the checks start gating merges.
      - name: ruff
        continue-on-error: true
        run: uv run ruff check src/ tests/

      - name: mypy
        continue-on-error: true
        run: uv run mypy src/

  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The Docker image installs from uv.lock, so a lockfile that has drifted
      # from pyproject.toml would ship dependencies nobody resolved on purpose.
      - name: uv.lock is up to date with pyproject.toml
        run: uv lock --check

      # pyproject.toml takes its version from __init__.py, but server.json is a
      # registry manifest the build system never sees. Keep the two in step.
      - name: server.json version matches the package
        run: |
          uv run python - <<'EOF'
          import json
          import pathlib
          import re
          import sys

          init = pathlib.Path("src/zammad_mcp_server/__init__.py").read_text()
          match = re.search(r'^__version__ = "([^"]+)"', init, re.MULTILINE)
          if not match:
              sys.exit("could not find __version__ in src/zammad_mcp_server/__init__.py")
          expected = match.group(1)

          manifest = json.loads(pathlib.Path("server.json").read_text())
          found = {"version": manifest["version"]}
          for i, package in enumerate(manifest.get("packages", [])):
              found[f"packages[{i}].version"] = package["version"]

          mismatched = {k: v for k, v in found.items() if v != expected}
          if mismatched:
              for key, value in mismatched.items():
                  print(f"::error file=server.json::{key} is {value}, expected {expected}")
              sys.exit(1)

          print(f"server.json matches __version__ ({expected})")
          EOF
