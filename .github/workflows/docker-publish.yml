name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Pull requests build to verify the Dockerfile still works, but publish nothing.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      # Build the runtime architecture first and keep it in the local daemon, so the
      # smoke test runs against the exact image that is about to be published.
      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: zammad-mcp:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          set -euo pipefail

          # Without credentials the server must refuse to serve HTTP at all.
          if docker run --rm -e ZAMMAD_URL=http://zammad.invalid \
              -e ZAMMAD_HTTP_TOKEN=dummy zammad-mcp:smoke; then
            echo "::error::server started over HTTP without authentication"
            exit 1
          fi

          docker run -d --name smoke -p 8000:8000 \
            -e ZAMMAD_URL=http://zammad.invalid \
            -e ZAMMAD_HTTP_TOKEN=dummy \
            -e ZAMMAD_MCP_AUTH=static \
            -e ZAMMAD_MCP_AUTH_TOKENS=ci:smoke-token \
            zammad-mcp:smoke

          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health >/dev/null && break
            sleep 1
          done

          curl -sf http://127.0.0.1:8000/health
          echo

          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          accept='Accept: application/json, text/event-stream'

          unauthorized=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:8000/mcp -H 'Content-Type: application/json' \
            -H "$accept" -d "$init")
          authorized=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:8000/mcp -H 'Content-Type: application/json' \
            -H "$accept" -H 'Authorization: Bearer smoke-token' -d "$init")

          echo "unauthenticated=$unauthorized authenticated=$authorized"
          docker logs smoke
          docker rm -f smoke >/dev/null

          [ "$unauthorized" = "401" ] || { echo "::error::expected 401, got $unauthorized"; exit 1; }
          [ "$authorized" = "200" ] || { echo "::error::expected 200, got $authorized"; exit 1; }

      # Pull requests stop here: they have already proven the image builds and boots.
      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
